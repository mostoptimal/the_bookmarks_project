{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookmarks Organizer</title>
        <link rel="icon" type="image/x-icon" href="{% static '/images/favico.ico' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: white;
            text-align: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .hero {
            padding: 50px 20px;

            font-size: 3rem;
            font-weight: bold;
        }

            margin-top: 20px;
        }
        .btn-custom {

            padding: 12px 25px;
            font-size: 1.1rem;
            border-radius: 25px;
        }

<body>
    <div class="hero">
        <h1>📚 Welcome to Bookmarks Organizer</h1>
        <p>Organize, search, and manage your bookmarks with ease.</p>
        <div>
            <a href="{% url 'dashboard-home' %}" class="btn btn-light btn-custom">Go to Dashboard</a>
        </div>
    </div>

</html>
